version: '3.8'

services:
  clash:
    image: aoian5173/clash:latest
    container_name: clash
    restart: unless-stopped
    ports:
      - "7890:7890/tcp"  # 代理端口
      - "7890:7890/udp"  # 代理端口UDP
      - "9090:9090/tcp"  # API端口
    volumes:
      - ./config.yaml:/root/.config/mihomo/config.yaml
    environment:
      - TZ=Asia/Shanghai
    networks:
      - clash-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  clash-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16